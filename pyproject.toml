[project]
name = "paper2svg-ultra"
version = "3.0.0"
description = "Pure AutoFigure-Edit Academic SVG Generator: Strict Method Slicer + Single Style Ref + SAM3/Local GPU/Zero-GPU + Deterministic Vector Repair"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "lxml>=5.2.0",
    "resvg-py>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "rich>=13.9.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.48.0"]
gpu = ["torch>=2.3.0", "torchvision>=0.18.0", "transformers>=4.44.0", "timm>=1.0.0", "kornia>=0.7.0", "einops>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper2svg"]

[tool.pytest.ini_options]
pythonpath = ["."]
